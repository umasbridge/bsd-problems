<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bridge Problems</title>
<style>
  :root {
    --red: #c0241c;
    --bg: #f3f4f6;          /* gray-100 */
    --card: #ffffff;
    --border: #e5e7eb;       /* gray-200 */
    --border-strong: #d1d5db;/* gray-300 */
    --text: #1f2937;         /* gray-800 */
    --text-muted: #9ca3af;   /* gray-400 */
    --text-soft: #6b7280;    /* gray-500 */
    --accent: #2563eb;       /* blue-600 */
    --accent-hover: #1d4ed8; /* blue-700 */
    --danger: #dc2626;       /* red-600 */
    --soft-fill: #f9fafb;    /* gray-50 */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top header (Dashboard MobileHeader desktop variant) ---------- */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    align-items: center;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar h1 {
    margin: 0;
    font-size: 1.125rem;     /* 18px */
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .set-name-label {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
  }
  .back-btn {
    font: inherit; font-size: 1.1rem;
    background: none; color: var(--text);
    border: none; padding: 2px 6px; cursor: pointer;
    line-height: 1;
  }
  .back-btn:hover { color: var(--accent); }

  /* ---------- Main content padding ---------- */
  .page { padding: 4px 24px 32px; }
  .action-row {
    display: flex; gap: 12px; align-items: center;
    flex-wrap: wrap;
    padding: 16px 0;
  }

  /* ---------- Buttons ---------- */
  .btn {
    font: inherit; font-size: 0.875rem;
    padding: 8px 16px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--border-strong);
    background: #fff; color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover:not(:disabled) { background: var(--soft-fill); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover:not(:disabled) { background: #fef2f2; }
  .btn-sm { padding: 4px 12px; font-size: 0.8125rem; }
  .btn-icon { padding: 4px 10px; }
  .btn-icon svg { display: block; }

  /* ---------- Per-problem Action menu (Remove / Move…) ---------- */
  .action-menu { position: relative; display: inline-block; }
  .action-dropdown {
    position: absolute; right: 0; top: 100%; margin-top: 4px; z-index: 50;
    background: #fff; border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    padding: 4px; min-width: 160px; text-align: left;
  }
  .action-item, .action-sub-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; border-radius: 6px;
    padding: 7px 10px; font: inherit; font-size: 0.85rem;
    color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .action-item:hover, .action-sub-item:hover { background: var(--soft-fill); }
  .action-item.danger { color: var(--danger); }
  .action-submenu {
    margin-top: 4px; border-top: 1px solid var(--border);
    padding-top: 4px; max-height: 220px; overflow-y: auto;
  }
  .action-sub-item { padding-left: 18px; color: var(--text-muted); }
  .action-sub-header {
    padding: 4px 10px 2px; font-size: 0.72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted);
  }
  .action-sub-empty, .action-sub-loading {
    padding: 7px 10px; font-size: 0.8rem; color: var(--text-muted);
  }
  .bp-toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    background: #111827; color: #fff; padding: 9px 16px;
    border-radius: 8px; font-size: 0.85rem;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none; z-index: 9999;
    transition: opacity 0.18s, transform 0.18s;
  }
  .bp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }



  /* ---------- Cards (problem sets list, problem display) ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card + .card { margin-top: 8px; }

  /* List rows for "My Problem Sets" — mirrors Dashboard doc rows */
  .set-list { display: flex; flex-direction: column; gap: 8px; }
  .set-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .set-info p { margin: 0; }
  .set-name { font-weight: 500; color: var(--text); font-size: 0.95rem; }
  .set-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .set-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .set-empty {
    padding: 32px; text-align: center; color: var(--text-muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }

  /* ---------- Filters card (Create flow) ---------- */
  .filters-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 24px; row-gap: 14px;
    margin-bottom: 16px;
  }
  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-group label {
    font-size: 0.875rem; font-weight: 600; color: var(--text);
    min-width: 140px;
  }
  .filter-group select,
  .filter-group input[type="number"] {
    font: inherit; font-size: 0.875rem;
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    flex: 1; min-width: 0;
  }
  .filter-group select option:disabled { color: var(--text-muted); }

  /* Multi-select filter (replaces native dropdown for the 3 set-builder filters) */
  .multi-filter-host { position: relative; flex: 1; min-width: 0; }
  .multi-filter-button {
    width: 100%;
    font: inherit; font-size: 0.875rem;
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    overflow: hidden;
  }
  .multi-filter-button .mf-caret { color: var(--text-muted); }
  .multi-filter-button .mf-summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .multi-filter-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 100%;
    max-height: 280px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    padding: 6px 4px;
    z-index: 30;
  }
  .multi-filter-panel.hidden { display: none; }
  .multi-filter-panel label {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px;
    font-size: 0.875rem; font-weight: 400; color: var(--text);
    min-width: 0;
    cursor: pointer;
    border-radius: 3px;
    white-space: nowrap;
  }
  .multi-filter-panel label:hover { background: #f3f4f6; }
  .multi-filter-panel label input[type="checkbox"] { flex: none; }
  .multi-filter-panel .mf-label { flex: 1; }
  .multi-filter-panel .mf-count { color: var(--text-muted); font-size: 0.8rem; }
  .multi-filter-panel input[type="checkbox"]:disabled + .mf-label { color: var(--text-muted); }
  .filter-actions {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .filter-actions .right-group { display: flex; gap: 12px; align-items: center; }

  .view-mode-actions {
    display: flex; gap: 12px; align-items: center; justify-content: center;
    margin-top: 16px; padding: 12px 0;
  }

  /* ---------- Nav controls (Prev/Next/Jump) ---------- */
  .nav-controls {
    display: flex; gap: 24px; align-items: center;
    justify-content: flex-start;
    padding: 4px 24px 6px;
    flex-wrap: wrap;
  }
  .nav-meta {
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 0.875rem; color: #000;
  }
  .nav-meta strong { font-weight: 600; margin-right: 3px; }
  .nav-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .nav-pos {
    font-variant-numeric: tabular-nums;
    font-size: 0.875rem; color: var(--text-soft);
    display: inline-flex; align-items: center; gap: 0;
  }
  .nav-jump-input {
    width: 3ch; border: none; outline: none;
    background: var(--accent); color: #fff;
    border-radius: 4px; padding: 1px 7px;
    font: inherit; font-size: 0.875rem; font-weight: 700;
    text-align: center; min-width: 22px;
    -moz-appearance: textfield;
  }
  .nav-jump-input::-webkit-outer-spin-button,
  .nav-jump-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .btn-nav-arrow { min-width: 28px; padding: 3px 8px; font-size: 1rem; }

  /* ---------- Problem display ---------- */
  .problem-card {
    padding: 0 0 16px;
    margin-bottom: 0;
  }
  .problem-header { text-align: center; margin-bottom: 10px; }
  .problem-header h2 {
    font-size: 1.125rem; font-weight: 700; margin: 0;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: #000;
  }

  .meta {
    display: flex; gap: 20px; flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--soft-fill);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.875rem;
    color: #000;
    margin-bottom: 10px;
  }
  .meta strong { font-weight: 600; margin-right: 4px; color: #000; }

  .contract-lead {
    margin: 8px 0 6px 0;
    font-size: 0.95rem;
    color: #000;
  }
  .contract-lead strong { font-weight: 600; margin-right: 4px; }
  .contract-lead .sep { display: inline-block; width: 24px; }

  .section {
    margin-top: 24px; padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: left;
  }
  .section-title {
    font-weight: 700; letter-spacing: 0.08em; text-align: center;
    margin: 0 0 14px 0; text-transform: uppercase;
    font-size: 0.875rem; color: #000;
  }
  .problem-text, .solution-text {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 0.95rem;
    color: #000;
  }
  .pt-mount ~ .problem-text { max-width: 478px; }

  .source-block {
    background: var(--soft-fill);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    font-size: 0.875rem;
    color: #000;
  }
  .source-row { display: flex; gap: 12px; padding: 4px 0; align-items: baseline; }
  .source-label { font-weight: 600; min-width: 110px; color: #000; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: #fff; border: 1px solid var(--border-strong); border-radius: 999px;
    padding: 2px 10px; font-size: 0.75rem; color: #000;
  }

  .reveal-btns {
    display: flex; gap: 10px; justify-content: flex-start; align-items: center;
    margin-top: 0; padding-top: 0;
    flex-wrap: wrap;
  }
  .problem-actions-bottom { margin-top: 14px; }

  /* ---------- Bidding table ---------- */
  .bidding-wrap { display: flex; justify-content: center; margin: 18px 0; }
  table.bidding {
    border-collapse: collapse;
    font-family: inherit;
    font-size: 0.95rem;
    color: #000;
  }
  table.bidding th, table.bidding td {
    padding: 4px 18px;
    text-align: center;
    border: none;
    min-width: 56px;
    font-variant-numeric: tabular-nums;
    color: #000;
  }
  .bidding-notes { text-align: left; font-size: 0.85rem; color: #555; margin-top: 6px; }
  .bidding-notes summary { cursor: pointer; font-style: italic; color: #888; }
  .bidding-notes div { margin: 2px 0; }
  table.bidding th {
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    color: #000;
  }

  /* ---------- Side-by-side bidding + deal ---------- */
  .deal-bidding-row {
    display: flex;
    gap: 28px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
    margin: 9px 0 10px;
  }
  .deal-bidding-row .bidding-wrap,
  .deal-bidding-row .deal-wrap { margin: 0; }

  /* ---------- 4-hand compass layout ---------- */
  .deal-wrap { display: flex; justify-content: center; margin: 14px 0; }
  .deal {
    display: inline-grid;
    grid-template-columns: auto auto auto;
    grid-template-rows: auto auto auto;
    column-gap: 18px;
    row-gap: 6px;
    align-items: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.95rem;
    color: #000;
  }
  .pos-n { grid-column: 2; grid-row: 1; justify-self: start; }
  .pos-w { grid-column: 1; grid-row: 2; justify-self: end;   }
  .pos-c { grid-column: 2; grid-row: 2; justify-self: start; }
  .pos-e { grid-column: 3; grid-row: 2; justify-self: start; }
  .pos-s { grid-column: 2; grid-row: 3; justify-self: start; }
  .pos-bl { grid-column: 1; grid-row: 3; justify-self: end; align-self: start; }
  .contract-lead-box {
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 0.75rem;
    background: #fff;
    line-height: 1.5;
    white-space: nowrap;
  }
  .contract-lead-box strong { font-weight: 600; }

  .hand { white-space: nowrap; text-align: left; line-height: 1.4; }
  .hand .row { text-align: left; }
  .hand.empty { color: var(--text-muted); font-style: italic; }

  .compass {
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 0.75rem;
    text-align: center;
    line-height: 1.1;
    min-width: 56px;
    color: #000;
    font-weight: 600;
    background: #fff;
  }
  .compass .ew { letter-spacing: 0.5em; }

  .red { color: var(--red); }
  .black { color: #000; }

  .empty { padding: 40px; text-align: center; color: var(--text-muted); }
  .hidden { display: none !important; }

  /* ---------- My Notes button ---------- */
  .btn-notes {
    background: #7c3aed; color: #fff; border-color: #7c3aed;
  }
  .btn-notes:hover:not(:disabled) { background: #6d28d9; border-color: #6d28d9; }
  .btn-source { background: #16a34a; color: #fff; border-color: #16a34a; }
  .btn-source:hover:not(:disabled) { background: #15803d; border-color: #15803d; }
  .btn-edit { background: #d97706; color: #fff; border-color: #d97706; }
  .btn-edit:hover:not(:disabled) { background: #b45309; border-color: #b45309; }
  .btn-play { background: #0284c7; color: #fff; border-color: #0284c7; }
  .btn-play:hover:not(:disabled) { background: #0369a1; border-color: #0369a1; }
  .btn-play.btn-play-active { background: #6b7280; border-color: #6b7280; }
  .btn-play.btn-play-active:hover:not(:disabled) { background: #4b5563; border-color: #4b5563; }

  /* ---------- Notes iframe container ---------- */
  .notes-frame-wrap {
    position: fixed; right: 0; top: 0;
    z-index: 100;
  }
  .notes-frame-wrap iframe {
    display: block; border: none;
    width: 380px; height: 500px;
  }
  .notes-drag-overlay {
    position: absolute; inset: 0; z-index: 1;
    cursor: move;
  }
  @media (max-width: 768px) {
    .notes-frame-wrap { inset: 0; }
    .notes-frame-wrap iframe { width: 100%; height: 100%; }
  }

  /* ---------- Modal (Dashboard archive/templates style) ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal {
    background: #fff; border-radius: 12px;
    padding: 24px;
    width: 90%; max-width: 440px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .modal-header h2 { margin: 0; font-size: 1.125rem; font-weight: 700; color: var(--text); }
  .modal-close {
    background: none; border: none; cursor: pointer;
    font-size: 22px; line-height: 1;
    color: var(--text-soft); padding: 0 4px;
  }
  .modal-close:hover { color: var(--text); }
  .modal-header { user-select: none; }
  .modal-body input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font: inherit; font-size: 0.95rem;
    color: var(--text);
    background: #fff;
  }
  .modal-body input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 20px;
  }
  /* Larger, scrollable variant for solution / source content */
  .modal.modal-content {
    max-width: 720px;
    max-height: 85vh;
    display: flex; flex-direction: column;
    color: #000;
  }
  .modal.modal-content .modal-body {
    overflow-y: auto;
    padding-right: 4px;
  }
  /* Modal form labels + number/text rows */
  .modal-body label.field-label {
    display: block;
    font-size: 0.875rem; font-weight: 600;
    color: var(--text);
    margin: 12px 0 4px;
  }
  .modal-body label.field-label:first-child { margin-top: 0; }
  .modal-body .field-label { font-size: 0.875rem; font-weight: 600; color: var(--text); margin: 12px 0 4px; }
  .modal-body input[type="number"] {
    width: 100px;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font: inherit; font-size: 0.95rem;
    color: var(--text);
    background: #fff;
  }
  .modal-body input[type="number"]:focus,
  .modal-body input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .field-hint { font-size: 0.75rem; color: var(--text-soft); margin-top: 4px; }

  /* Admin-only controls hidden when the body lacks the .is-admin class. */
  body:not(.is-admin) .admin-only { display: none !important; }
  /* Signed-in-only controls hidden when the body lacks the .is-signed-in class. */
  body:not(.is-signed-in) .signed-in-only { display: none !important; }

  .edited-badge {
    display: inline-block; margin-left: 8px;
    padding: 2px 8px; border-radius: 999px;
    background: #fef3c7; color: #92400e;
    border: 1px solid #f59e0b;
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em;
    vertical-align: middle;
  }

  /* ---------- Mobile (≤640px) ---------- */
  @media (max-width: 640px) {
    .topbar { padding: 8px 12px; flex-wrap: wrap; gap: 8px; row-gap: 8px; }
    .topbar-left { flex-wrap: wrap; gap: 8px; }
    .nav-controls { padding: 4px 12px 6px; gap: 12px; }
    .nav-right { flex-wrap: wrap; }
    .page { padding: 10px 12px 24px; }
    .action-row { gap: 6px; padding: 10px 0; }
    .btn { padding: 6px 10px; font-size: 0.8125rem; }
    .btn-sm { padding: 4px 8px; }
    .problem-header { flex-wrap: wrap; gap: 4px 8px; }
    .problem-card { padding: 10px 12px; }
    .deal-bidding-row { flex-direction: column; align-items: center; gap: 12px; }
    .meta { flex-wrap: wrap; gap: 4px 14px; font-size: 0.875rem; }

    /* Keep the geographic 4-hand compass on mobile — just shrink it. */
    .deal-wrap { margin: 12px 0; }
    .deal {
      column-gap: 8px; row-gap: 4px;
      font-size: 0.8125rem;
    }
    .compass {
      font-size: 0.65rem;
      padding: 4px 6px;
      min-width: 40px;
    }

    /* Bidding can scroll if it overflows */
    .bidding-wrap { overflow-x: auto; }
    table.bidding { font-size: 0.875rem; }
    table.bidding th, table.bidding td { padding: 4px 6px; min-width: 44px; }

    .contract-lead { flex-wrap: wrap; gap: 4px 12px; }

    .source-row { gap: 4px; }
    .source-label { min-width: 80px; }

    /* Migration banner more compact */
    .migration-banner { padding: 10px 12px; }

    /* Match bsd-app: hide button text labels on mobile, leave the icon. */
    .mobile-hide-label { display: none; }
    .btn-icon { padding: 6px 8px; }
  }

  /* One-time migration banner (appears only when localStorage has unmigrated tag/level overrides). */
  .migration-banner {
    background: #fef3c7;
    border-bottom: 1px solid #f59e0b;
    padding: 12px 24px;

<script>
/* Admin gate (.is-admin body class) is set asynchronously by the module
   <script> at the bottom of this file, after canEdit() resolves against
   bp_collaborators. Edit affordances start hidden and appear only when
   the current user is a collaborator. */

/* SUIT_ORDER / SUIT_SYM and all LIN-building functions (problemToLin,
   isValidDeck, parseContractStr, ...) come from lin.js above. */

/* ---------- Draggable modals ---------- */
function makeDraggable(handle, panel) {
  let tx = 0, ty = 0;
  handle.style.cursor = 'grab';
  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('button, input, select, textarea, a')) return;
    const startX = e.clientX - tx;
    const startY = e.clientY - ty;
    handle.style.cursor = 'grabbing';
    const onMove = mv => {
      tx = mv.clientX - startX;
      ty = mv.clientY - startY;
      panel.style.transform = `translate(${tx}px, ${ty}px)`;
    };
    const onUp = () => {
      handle.style.cursor = 'grab';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  const panel = overlay.querySelector('.modal');
  const header = panel?.querySelector('.modal-header');
  if (panel && header) makeDraggable(header, panel);
});
const SUIT_COLOR = { S: 'black', H: 'red', D: 'red', C: 'black' };
const SEAT_ORDER = ['W','N','E','S'];

/* Inline SVG icons matching Dashboard.jsx (lucide-style, 16x16 stroke=2) */
const ICONS = {
  pages:       '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="3" x2="8" y2="21"/></svg>',
  discussions: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  download:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  trash:       '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function colorizeSuits(text) {
  if (text == null || text === '') return '';
  const esc = escapeHtml(text);
  return esc
    // Unicode suit symbols
    .replace(/♠/g, '<span class="black">♠</span>')
    .replace(/♣/g, '<span class="black">♣</span>')
    .replace(/♥/g, '<span class="red">♥</span>')
    .replace(/♦/g, '<span class="red">♦</span>')
    // ASCII suit-first card format (e.g. "S9", "HA", "D10", "CK") — leads and card references.
    // Negative lookbehind/lookahead prevents matching suit letters inside longer words.
    .replace(/(?<![A-Za-z\d])([Ss])(10|[AKQJT2-9])(?![A-Za-z\d])/g, '<span class="black">♠</span>$2')
    .replace(/(?<![A-Za-z\d])([Hh])(10|[AKQJT2-9])(?![A-Za-z\d])/g, '<span class="red">♥</span>$2')
    .replace(/(?<![A-Za-z\d])([Dd])(10|[AKQJT2-9])(?![A-Za-z\d])/g, '<span class="red">♦</span>$2')
    .replace(/(?<![A-Za-z\d])([Cc])(10|[AKQJT2-9])(?![A-Za-z\d])/g, '<span class="black">♣</span>$2')
    // ASCII suit letters after a bid level (e.g. "4H", "4h", "1s" → colored symbol)
    .replace(/([1-7])([Ss])\b/g, '$1<span class="black">♠</span>')
    .replace(/([1-7])([Hh])\b/g, '$1<span class="red">♥</span>')
    .replace(/([1-7])([Dd])\b/g, '$1<span class="red">♦</span>')
    .replace(/([1-7])([Cc])\b/g, '$1<span class="black">♣</span>');
}

function renderHandRows(hand) {
  return SUIT_ORDER.map(suit => {
    const cards = (hand && hand[suit] !== undefined && hand[suit] !== null) ? hand[suit] : '—';
    const display = cards === '' ? '—' : cards;
    return `<div class="row"><span class="${SUIT_COLOR[suit]}">${SUIT_SYM[suit]}</span> ${display}</div>`;
  }).join('');
}

function renderHandBlock(hand, visible) {
  if (!visible) return '';
  return `<div class="hand">${renderHandRows(hand)}</div>`;
}

function renderDeal(hands, visibleSeats, bottomLeft) {
  const v = visibleSeats || ['N','E','S','W'];
  const isV = (p) => v.includes(p);
  return `
    <div class="deal-wrap"><div class="deal">
      <div class="pos-n">${renderHandBlock(hands.N, isV('N'))}</div>
      <div class="pos-w">${renderHandBlock(hands.W, isV('W'))}</div>
      <div class="pos-c"><div class="compass">N<br><span class="ew">W&nbsp;E</span><br>S</div></div>
      <div class="pos-e">${renderHandBlock(hands.E, isV('E'))}</div>
      <div class="pos-s">${renderHandBlock(hands.S, isV('S'))}</div>
      ${bottomLeft ? `<div class="pos-bl">${bottomLeft}</div>` : ''}
    </div></div>`;
}

// Imported problems often duplicate the contract/lead as a leading sentence
// in problem_text (e.g. "Contract 6NT. Lead ♦10."). Those are now exposed as
// dedicated columns + edit fields, so strip the redundant prefix at render
// time. Non-destructive — DB stays as-is, just hidden from the view.
function stripContractLeadPrefix(text) {
  if (!text) return text;
  return text.replace(/^\s*Contract\b[^.]*\.\s*(?:Lead\b[^.]*\.\s*)?/i, '');
}

function displayFormat(p) {
  const raw = (p.format || '').trim();
  if (!raw) return '';
  if (/imp/i.test(raw)) return 'IMP';
  if (/(mp|match)/i.test(raw)) return 'MP';
  return raw;
}

function renderNavMeta(p) {
  const format = displayFormat(p);
  return [
    format ? `<span><strong>Format:</strong> ${escapeHtml(format)}</span>` : '',
  ].filter(Boolean).join('');
}

function setNavPos(num, total) {
  const input = document.getElementById('jumpInput');
  input.value = num;
  input.style.width = `calc(${Math.max(String(total).length, 3)}ch + 14px)`;
  document.getElementById('navTotal').textContent = ` / ${total}`;
}

function withLinDeal(p) {
  if (!p?.lin || !globalThis.bpLin?.dealFromLin) return p;
  const deal = globalThis.bpLin.dealFromLin(p.lin);
  if (!deal) return p;
  const { contract, lead, dealer, vulnerability, ...rest } = deal;
  return { ...p, ...rest };
}

/* Anchors written by the new editor are zero-width-space-wrapped diag ids:
   `​[diag-XXXX]​`. Those are stripped from the rendered text. Legacy prose
   anchors (free-text phrases from the source data) stay visible. */
function isMarkerAnchor(s) {
  return /^​?\[diag-[a-z0-9]+\]​?$/.test(s || '');
}
function isEmptyDiagramHands(hands) {
  if (!hands) return true;
  for (const seat of ['N','E','S','W']) {
    const h = hands[seat] || {};
    if (h.S || h.H || h.D || h.C) return false;
  }
  return true;
}

function renderSolutionContent(p) {
  const sol = p.solution || '';
  const embeds = (p.embedded_diagrams || []).slice();
  if (!embeds.length) {
    return `<div class="solution-text">${colorizeSuits(sol)}</div>`;
  }
  const places = embeds
    .map(d => ({ d, idx: sol.indexOf(d.anchor) }))
    .filter(x => x.idx >= 0)
    .sort((a, b) => a.idx - b.idx);
  if (!places.length) {
    return `<div class="solution-text">${colorizeSuits(sol)}</div>`;
  }
  let out = '';
  let pos = 0;
  for (const { d, idx } of places) {
    const isMarker = isMarkerAnchor(d.anchor);
    const isEmpty  = isEmptyDiagramHands(d.hands);

    // Text up to anchor — include the anchor for legacy prose, omit for markers.
    const segmentEnd = isMarker ? idx : idx + d.anchor.length;
    out += `<div class="solution-text">${colorizeSuits(sol.substring(pos, segmentEnd))}</div>`;

    if (!isEmpty) {
      const seats = d.visible_seats || Object.keys(d.hands || {});
      out += `<div class="embedded-diagram">${renderDeal(d.hands, seats)}</div>`;
    }

    pos = idx + d.anchor.length;
  }
  out += `<div class="solution-text">${colorizeSuits(sol.substring(pos))}</div>`;
  return out;
}

// Some imported problems (e.g. European source) don't have all four seats
// in hands_structured — only the problem-visible ones — but list the full
// deal as prose lines at the top of the solution: "North: ♠… ♥… ♦… ♣…"
// for each seat. Detect that pattern, parse it into a hands object, and
// strip those lines so renderSolutionInner can show the compass instead.
// Returns null if the prose doesn't match cleanly.
function tryExtractDealFromSolution(sol) {
  if (!sol) return null;
  const lines = sol.split('\n');
  const seatMap = { north: 'N', east: 'E', south: 'S', west: 'W' };
  const suitMap = { '♠': 'S', '♥': 'H', '♦': 'D', '♣': 'C' };
  const hands = {};
  const indices = [];
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^\s*(North|East|South|West)\s*[:\-–—]\s*(.+?)\s*$/i);
    if (!m) continue;
    const seat = seatMap[m[1].toLowerCase()];
    if (hands[seat]) return null; // duplicate seat — bail
    const hand = { S: '', H: '', D: '', C: '' };
    let any = false;
    const re = /([♠♥♦♣])\s*([AKQJT0-9]*)/g;
    let mm;
    while ((mm = re.exec(m[2])) !== null) {
      hand[suitMap[mm[1]]] = mm[2] || '';
      any = true;
    }
    if (!any) continue;
    hands[seat] = hand;
    indices.push(i);
  }
  if (Object.keys(hands).length !== 4 || indices.length !== 4) return null;
  // Require the 4 lines to be consecutive (only blank lines allowed between).
  indices.sort((a, b) => a - b);
  for (let i = 1; i < indices.length; i++) {
    for (let j = indices[i - 1] + 1; j < indices[i]; j++) {
      if (lines[j].trim() !== '') return null;
    }
  }
  const startIdx = indices[0];
  const endIdx = indices[indices.length - 1];
  const newLines = [...lines.slice(0, startIdx), ...lines.slice(endIdx + 1)];
  const newSolution = newLines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  return { hands, newSolution };
}

/* ---------- "Play it out" — key in a position / end position ----------
   Full deals or partial endings (equal cards per hand). "x" = irrelevant
   small card, auto-filled with the lowest spot cards not used elsewhere in
   that suit. Play opens the BBO handviewer (DD toggle for per-card
   verdicts); Save hands the position to the "Key in a problem" editor
   prefilled, so the normal insert path stores it. */

// raw: {N:{S,H,D,C},...} as typed. Returns { hands } or { error }, plus
// an optional non-blocking warning.
function resolvePosition(raw) {
  const tokens = {};
  for (const seat of LIN_SEATS) {
    tokens[seat] = {};
    for (const su of SUIT_ORDER) {
      const norm = (raw[seat][su] || '').toUpperCase().replace(/T/g, '10').replace(/[^AKQJ0-9X]/g, '');
      const t = tokenizeSuit(norm);
      for (const c of t) {
        if (c !== 'X' && !RANK_ORDER.includes(c)) return { error: `Unrecognized card "${c}" in ${SEAT_FULL[seat]} ${SUIT_SYM[su]}` };
      }
      tokens[seat][su] = t;
    }
  }

  const counts = LIN_SEATS.map(seat => SUIT_ORDER.reduce((n, su) => n + tokens[seat][su].length, 0));
  if (counts[0] < 1) return { error: 'Enter at least one card per hand.' };
  if (!counts.every(n => n === counts[0])) {
    return { error: `All hands need the same number of cards (currently ${LIN_SEATS.map((s, i) => `${s}:${counts[i]}`).join(' ')}).` };
  }

  let warning = null;
  for (const su of SUIT_ORDER) {
    const explicit = LIN_SEATS.flatMap(seat => tokens[seat][su].filter(c => c !== 'X'));
    const dup = explicit.find((c, i) => explicit.indexOf(c) !== i);
    if (dup) return { error: `${SUIT_SYM[su]}${dup} appears twice.` };
    const avail = RANK_ORDER.filter(r => !explicit.includes(r)); // low → high
    const minExplicit = explicit.length ? Math.min(...explicit.map(c => RANK_ORDER.indexOf(c))) : 99;
    for (const seat of LIN_SEATS) {
      tokens[seat][su] = tokens[seat][su].map(c => {
        if (c !== 'X') return c;
        const fill = avail.shift();
        if (!fill) return null;
        if (RANK_ORDER.indexOf(fill) > minExplicit) warning = `An x in ${SUIT_SYM[su]} was filled with a card higher than an entered ${SUIT_SYM[su]} spot.`;
        return fill;
      });
      if (tokens[seat][su].includes(null)) return { error: `Too many cards in ${SUIT_SYM[su]}.` };
    }
  }

  const hands = {};
  for (const seat of LIN_SEATS) {
    hands[seat] = {};
    for (const su of SUIT_ORDER) {
      hands[seat][su] = tokens[seat][su]
        .sort((a, b) => RANK_ORDER.indexOf(b) - RANK_ORDER.indexOf(a))
        .join('');
    }
  }
  return { hands, warning };
}

// Pseudo-problem for the position: nominal declarer sits to the leader's
// right (the handviewer always puts declarer's LHO on lead), bidding the
// trump at the one level. problemToLin() then reproduces the position.
// goal: { side: 'NS'|'EW', k } or null.
//
// The handviewer's DD engine scores partial deals against the full
// contract target while silently crediting the 13−N missing tricks to
// E-W (verified empirically 8/2026: an 8-card ending at 1NT by E showed
// +2 = 4 real E-W tricks + 5 phantoms − 7). The nominal level below is
// chosen to cancel that offset so the badge reads as a direct trick
// count — ddLegend() states the mapping.
function positionDraft(hands, trump, leader, goal) {
  const declarer = nominalDeclarer(leader);
  const nCards = SUIT_ORDER.reduce((n, su) => n + tokenizeSuit(hands.N[su]).length, 0);
  // Pick the level so the make/down boundary ("=") lands on the goal:
  // target = level+6 = phantom credit + declaring side's real tricks at
  // the boundary. Goal on the declaring side ⇒ boundary is the goal
  // itself; goal on the leading side ⇒ boundary is its complement
  // (their tricks come from setting the nominal contract).
  const phantom = sideOfSeat(declarer) === 'EW' ? 13 - nCards : 0;
  const boundary = goal
    ? (goal.side === sideOfSeat(declarer) ? goal.k : nCards - goal.k)
    : Math.ceil(nCards / 2);
  const level = Math.max(1, Math.min(7, boundary + phantom - 6));
  const contractSym = level + (trump === 'N' ? 'NT' : SUIT_SYM[trump]);
  const goalText = goal ? ` ${goal.side === 'NS' ? 'N-S' : 'E-W'} need ${goal.k} of the ${nCards} tricks.` : '';
  return {
    book_title: 'My Positions',
    subcategory: 'Double Dummy',
    dealer: declarer,
    vulnerability: 'None Vul',
    hands_structured: hands,
    problem_visible_hands: ['N', 'E', 'S', 'W'],
    bidding: { dealer: declarer, calls: [contractSym, 'Pass', 'Pass', 'Pass'] },
    contract: contractSym,
    lead: null,
    problem_text: `${nCards === 13 ? 'Deal' : `${nCards}-card end position`}: ${trump === 'N' ? 'no trumps' : SUIT_SYM[trump] + ' trumps'}, ${SEAT_FULL[leader]} on lead.${goalText}`,
  };
}

// How to read the handviewer's DD badges for this position (see the
// phantom-trick note on positionDraft). Returns null when the plain
// make/down reading applies with nothing to add.
function badgeWord(r) { return r === 0 ? '"="' : r > 0 ? `+${r}` : `down ${-r}`; }

function ddLegend(nCards, goal, leader, level) {
  const declSeat = nominalDeclarer(leader);
  const declSide = sideOfSeat(declSeat);
  const declName = declSide === 'NS' ? 'N-S' : 'E-W';
  const phantom = declSide === 'EW' ? 13 - nCards : 0;
  const needReal = level + 6 - phantom; // declaring side's real tricks at "="
  let s = '';
  if (nCards < 13) {
    s = needReal <= nCards
      ? `Nominal contract by ${SEAT_FULL[declSeat]}${phantom ? ` (E-W are credited ${phantom} unseen tricks)` : ''}: "=" means ${declName} take ${needReal} of the ${nCards} tricks.`
      : `Nominal contract by ${SEAT_FULL[declSeat]}: ${declName} tricks = ${level + 6} minus the down number.`;
  }
  if (goal) {
    const gName = goal.side === 'NS' ? 'N-S' : 'E-W';
    if (goal.side === declSide) {
      const t = goal.k - needReal; // success ⇔ badge ≥ t
      s += ` ${gName} need ${goal.k}: ${badgeWord(t)} or better succeeds for ${gName}.`;
    } else {
      const t = (nCards - goal.k) - needReal; // success ⇔ badge ≤ t
      s += t >= 0
        ? ` ${gName} need ${goal.k}: ${badgeWord(t)} or any further down succeeds for ${gName}.`
        : ` ${gName} need ${goal.k}: ${badgeWord(t)} or further down succeeds for ${gName}.`;
    }
  }
  return s.trim() || null;
}

let _posModal = null;

function closePositionModal() {
  if (_posModal) { _posModal.remove(); _posModal = null; }

function onPositionModalKey(e) { if (e.key === 'Escape') closePositionModal(); }

function readPositionForm() {
  const raw = {};
  for (const seat of LIN_SEATS) {
    raw[seat] = {};
    for (const su of SUIT_ORDER) {
      raw[seat][su] = _posModal.querySelector(`input[data-pos="${seat}${su}"]`).value;
    }
  }
  return raw;
}

function positionStatus(msg, kind) {
  const el = _posModal.querySelector('#posStatus');
  el.textContent = msg || '';
  el.style.color = kind === 'warn' ? '#b45309' : kind === 'info' ? '#1d4ed8' : '#dc2626';
}

// Returns { side, k } | null (no goal entered) | undefined (invalid).
function readPositionGoal(nCards) {
  const kRaw = _posModal.querySelector('#posGoalK').value.trim();
  if (!kRaw) return null;
  const k = parseInt(kRaw, 10);
  if (isNaN(k) || k < 1 || k > nCards) {
    positionStatus(`Tricks needed must be between 1 and ${nCards}.`);
    return undefined;
  }
  const sideSel = _posModal.querySelector('#posGoalSide').value;
  const side = sideSel || sideOfSeat(nominalDeclarer(_posModal.querySelector('#posLeader').value));
  return { side, k };
}

// Build a position-modal prefill from the editor's current tab state.
// Hands map 1:1 onto the grid; trump is a best-effort parse of the contract
// (leader is left at the modal default for the user to set).
function prefillFromEditorState(state) {
  if (!state) return null;
  const hands = state.hands_structured || null;
  let trump = 'N';
  // Read the strain that follows the contract level, e.g. "4S" / "3NT" / "6♥".
  const m = (state.contract || '').toUpperCase().match(/(\d)\s*(NT|N|S|H|D|C|♠|♥|♦|♣)/);
  if (m) {
    const strain = m[2];
    trump = { '♠': 'S', '♥': 'H', '♦': 'D', '♣': 'C', 'NT': 'N', 'N': 'N' }[strain] || strain;
  }
  return { hands, trump };
}

let problems = [];          // all loaded problems
let pool = [];              // problems matching current filters
let problemSet = [];        // active set (subset of pool of size N)
let cursor = 0;             // index into problemSet

const PROBLEM_FORMATS = ['IMP', 'MP'];
const PROBLEM_CATEGORIES = [
  { value: 'Bidding',           label: 'bidding' },
  { value: 'Declarer Play',     label: 'declarer play' },
  { value: 'Defend or Play',    label: 'defend or play' },
  { value: 'Defense',           label: 'defense' },
  { value: 'Double Dummy',      label: 'double dummy' },
  { value: 'Suit Combinations', label: 'suit combinations' },
];

/* Filter inclusion rule:
   When a filter value is selected (e.g. level=4), the "available problems"
   pool keeps:
     - problems whose value matches the filter, AND
     - problems whose value is unset (null / blank / empty array).
   Only problems with a definite non-matching value are excluded.
   Every per-field matcher below routes through `passesFilter` so this rule
   is encoded in one place. */
function isUnset(v) {
  if (v == null) return true;
  if (typeof v === 'string' && v.trim() === '') return true;
  if (Array.isArray(v) && v.length === 0) return true;
  return false;
}
// filterValue can be a single value (legacy) or an array of values
// (multi-select). An empty/null/empty-array filter means "no filter".
// With ≥1 selections, the value passes if it's unset, OR matches any of
// the selected values (OR semantics across the multi-selection).
function passesFilter(value, filterValue, equalsFn) {
  const eq = equalsFn || ((v, t) => v === t);
  if (Array.isArray(filterValue)) {
    if (filterValue.length === 0) return true;
    if (isUnset(value)) return true;
    return filterValue.some(t => eq(value, t));
  }
  if (filterValue == null || filterValue === '') return true;
  if (isUnset(value)) return true;
  return eq(value, filterValue);
}

function categoryMatches(p, cat) {
  return passesFilter(p.subcategory, cat);
}

function formatMatches(p, fmt) {
  return passesFilter(p.format, fmt, (v, target) => v === target || displayFormat({ format: v }) === target);
}

function sourceMatches(p, src) {
  return passesFilter(p.book_title, src);
}

function levelMatches(p, lvl) {
  return passesFilter(effectiveLevel(p), lvl, (v, target) => Number(v) === Number(target));
}

// Tags filter is conditional: only active when exactly one category is selected.
// OR semantics across selected tags; match-or-unset (problems with no tags pass).
function tagsMatches(p, tagFilter) {
  return passesFilter(p.tags, tagFilter, (arr, target) => Array.isArray(arr) && arr.includes(target));
}

function matchesFilters(p, f) {
  if (!formatMatches(p, f.type))    return false;
  if (!sourceMatches(p, f.source))  return false;
  if (!categoryMatches(p, f.cat))   return false;
  if (!levelMatches(p, f.level))    return false;
  if (!tagsMatches(p, f.tags))      return false;
  return true;
}

function currentFilters() {
  // Tags filter only counts if its host is currently visible (i.e. exactly
  // one category is selected and that category has tags).
  const tagsVisible = !document.getElementById('filterTagsGroup')?.classList.contains('hidden');
  return {
    type:   _multiFilters.type   ? _multiFilters.type.getSelected()   : [],
    source: _multiFilters.source ? _multiFilters.source.getSelected() : [],
    cat:    _multiFilters.cat    ? _multiFilters.cat.getSelected()    : [],
    level:  _multiFilters.level  ? _multiFilters.level.getSelected()  : [],
    tags:   (tagsVisible && _multiFilters.tags) ? _multiFilters.tags.getSelected() : [],
  };
}

function refreshPool() {
  const f = currentFilters();
  pool = problems.filter(p => matchesFilters(p, f));
  greyOutOptions();
  updateNumProblemsBound();
}

// Constrain the "No. of problems" input to the size of the currently matching pool,
// minus what's already in the draft (so Add can never request more than possible).
function updateNumProblemsBound() {
  const input = document.getElementById('numProblems');
  const avail = document.getElementById('availCount');
  if (!input) return;
  const existingIds = new Set(problemSet.map(p => p.problem_id));
  const remaining = pool.filter(p => !existingIds.has(p.problem_id)).length;
  if (remaining <= 0) {
    input.max = '';
    input.disabled = true;
    if (avail) avail.textContent = '(none available)';
    return;
  }
  input.disabled = false;
  input.max = String(remaining);
  if (parseInt(input.value, 10) > remaining) input.value = String(remaining);
  if (avail) avail.textContent = `(max ${remaining})`;
}

function greyOutOptions() {
  const f = currentFilters();
  const filters = [
    { mf: _multiFilters.type,   key: 'type',   match: formatMatches   },
    { mf: _multiFilters.source, key: 'source', match: sourceMatches   },
    { mf: _multiFilters.cat,    key: 'cat',    match: categoryMatches },
    { mf: _multiFilters.level,  key: 'level',  match: levelMatches    },
    { mf: _multiFilters.tags,   key: 'tags',   match: tagsMatches     },
  ];
  for (const d of filters) {
    if (!d.mf) continue;
    // Per-option count: how many problems would match if ONLY this option were
    // selected for this filter (other filters held at their current state).
    const others = { ...f, [d.key]: [] };
    const candidates = problems.filter(p => matchesFilters(p, others));
    for (const opt of d.mf.options) {
      const n = candidates.filter(p => d.match(p, opt.value)).length;
      d.mf.setOptionCount(opt.value, n);
    }
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getNumRequested() {
  const nRaw = parseInt(document.getElementById('numProblems').value, 10);
  return (isNaN(nRaw) || nRaw <= 0) ? null : nRaw;
}

function updateActionButtons() {
  // Finish is always enabled — clicking it auto-adds from filters if nothing's been added yet.
  document.getElementById('createSet').disabled = false;
}

function addToProblemSet() {
  refreshPool();
  if (!pool.length) {
    alert('No problems match the current filters.');
    return;
  }
  const existingIds = new Set(problemSet.map(p => p.problem_id));
  const candidates = pool.filter(p => !existingIds.has(p.problem_id));
  if (!candidates.length) {
    alert('All matching problems are already in your draft set.');
    return;
  }
  const n = getNumRequested();
  const take = n ? Math.min(n, candidates.length) : candidates.length;
  const additions = shuffle(candidates).slice(0, take);
  problemSet = shuffle(problemSet.concat(additions));
  updateActionButtons();
  updateNumProblemsBound();
}

/* ---------- View mode: browse filtered problems one-by-one ---------- */
let viewMode = false;
let viewPool = [];
let viewCursor = 0;

function enterViewMode() {
  refreshPool();
  if (!pool.length) {
    alert('No problems match the current filters.');
    return;
  }
  viewPool = pool.slice();
  viewCursor = 0;
  viewMode = true;
  document.getElementById('filtersCard').classList.add('hidden');
  document.getElementById('navControls').classList.remove('hidden');
  showViewProblem();
}

function exitViewMode() {
  viewMode = false;
  viewPool = [];
  viewCursor = 0;
  document.getElementById('root').innerHTML = '';
  document.getElementById('filtersCard').classList.remove('hidden');
  document.getElementById('navControls').classList.add('hidden');
}

function showViewProblem() {
  if (!viewPool.length) return;
  viewCursor = Math.max(0, Math.min(viewPool.length - 1, viewCursor));
  const num = viewCursor + 1;
  const p = viewPool[viewCursor];
  const inSet = problemSet.some(x => x.problem_id === p.problem_id);
  document.getElementById('root').innerHTML = renderProblemStage(p, num, { isSavedSet: false, hideGrade: true }) +
    `<div class="view-mode-actions">
      <button class="btn ${inSet ? 'btn-danger' : 'btn-primary'}" id="viewToggleBtn">${inSet ? 'Remove from Problem Set' : 'Add to Problem Set'}</button>
      <button class="btn" id="viewExitBtn">Exit</button>
    </div>`;
  setNavPos(num, viewPool.length);
  document.getElementById('navMeta').innerHTML = renderNavMeta(p);
  document.getElementById('viewToggleBtn').addEventListener('click', toggleViewProblem);
  document.getElementById('viewExitBtn').addEventListener('click', exitViewMode);
  mountPlayTable(p);
  const solBtn = document.getElementById('showSolutionBtn');
  if (solBtn) solBtn.addEventListener('click', () => {
    openContentModal(`Solution ${num}`, renderSolutionInner(p));
  });
  const srcBtn = document.getElementById('showSourceBtn');
  if (srcBtn) srcBtn.addEventListener('click', () => {
    openContentModal(`Source ${num}`, renderSourceInner(p));
  });
  const editBtn = document.getElementById('editBtn');
  if (editBtn) editBtn.addEventListener('click', () => {
    window.bpEditor?.openEditor(p, { onSave: (updated) => {
      if (!updated || !updated.id) return;
      updated.problem_id = updated.id;
      const idx = problems.findIndex(x => x.id === updated.id);
      if (idx >= 0) problems[idx] = updated;
      for (let i = 0; i < viewPool.length; i++) {
        if (viewPool[i]?.id === updated.id) viewPool[i] = updated;
      }
      for (let i = 0; i < problemSet.length; i++) {
        if (problemSet[i]?.id === updated.id) problemSet[i] = updated;
      }
      showViewProblem();
    }});
  });
}

function toggleViewProblem() {
  const p = viewPool[viewCursor];
  const idx = problemSet.findIndex(x => x.problem_id === p.problem_id);
  if (idx >= 0) {
    problemSet.splice(idx, 1);
  } else {
    problemSet.push(p);
  }
  updateNumProblemsBound();
  showViewProblem();
}

async function createProblemSet() {
  if (viewMode) exitViewMode();
  const n = getNumRequested();
  // In add mode the "No. of problems" field is not a total target — the user
  // saves the existing problems plus whatever they explicitly added, with no
  // surprise auto-fill.
  const target = addMode ? 0 : (n || 0);
  if (!problemSet.length && target) {
    addToProblemSet();
    if (!problemSet.length) return;
  }
  if (!problemSet.length) {
    alert('No problems in the set. Use Add or View to pick problems first.');
    return;
  }
  if (target && problemSet.length < target) {
    const shortfall = target - problemSet.length;
    refreshPool();
    const existingIds = new Set(problemSet.map(p => p.problem_id));
    const candidates = pool.filter(p => !existingIds.has(p.problem_id));
    if (candidates.length > 0) {
      const canFill = Math.min(shortfall, candidates.length);
      if (confirm(`You picked ${problemSet.length} problem${problemSet.length === 1 ? '' : 's'} but requested ${target}. Add ${canFill} more randomly from the current filters?`)) {
        const additions = shuffle(candidates).slice(0, canFill);
        problemSet = shuffle(problemSet.concat(additions));
      }
    }
  }
  const ids = problemSet.map(p => p.problem_id);
  try {
    if (currentSavedId) {
      const sets = loadSets();
      const existing = sets.find(s => s.id === currentSavedId);
      if (existing) {
        await updateSet(currentSavedId, {
          name: draftSetName || existing.name,
          problemIds: ids,
        });
      }
    } else {
      currentSavedId = await saveSet(draftSetName || `Set ${nextSetSeq()}`, ids);
    }
  } catch (e) {
    alert('Failed to save set: ' + (e.message || e));
    return;
  }
  problemSet = [];
  draftSetName = null;
  currentSavedId = null;
  cursor = 0;
  refreshPool();
  updateActionButtons();
  document.getElementById('root').innerHTML = '';
  switchPage('sets');
}

/* ---------- Problem-set persistence (DB-backed, in-memory cache) ----------
   Cache is hydrated once at startup via window.bpHydrateSets() (called from
   the module script after auth resolves). All reads come from the cache; all
   writes go to Supabase via window.bpDb.* and update the cache. */
const _setsCache = [];
let currentSavedId = null;
let readingBook = false;   // true while reading a library book (read-only, not a draft)
let readingBookTitle = null; // which book is being read (for per-book resume progress)
let readingBookJumbled = false; // whether the current book read is in jumbled order
let addMode = false;       // true while adding problems to an existing set (filters stay visible)
let draftSetName = null;
let _viewingSharedSet = null; // { showSolution } when viewing a shared set
const _sharedSetsCache = [];

// Play set mode: determined from URL params at page load

function loadSets() {
  return _setsCache;
}
function nextSetSeq() {
  return _setsCache.length + 1;
}

async function saveSet(name, problemIds) {
  const created = await window.bpDb.createSet(name, problemIds);
  _setsCache.unshift(created);
  return created.id;
}
async function updateSet(id, patch) {
  const idx = _setsCache.findIndex(s => s.id === id);
  if (idx < 0) return;
  if ('name' in patch) {
    await window.bpDb.updateSetMeta(id, { name: patch.name });
    _setsCache[idx].name = patch.name;
  }
  if ('problemIds' in patch) {
    await window.bpDb.replaceSetItems(id, patch.problemIds);
    _setsCache[idx].problemIds = patch.problemIds.slice();
  }
  _setsCache[idx].updatedAt = new Date().toISOString();
  // Move just-touched set to the top, mirroring the DB ordering.
  const moved = _setsCache.splice(idx, 1)[0];
  _setsCache.unshift(moved);
}
async function deleteSet(id) {
  await window.bpDb.deleteSetById(id);
  const idx = _setsCache.findIndex(s => s.id === id);
  if (idx >= 0) _setsCache.splice(idx, 1);
}

/* Hook used by the module script (db-init) to swap the cache after hydrating
   from the DB. After replacement, re-render the sets list if it's visible. */
window.bpReplaceSetsCache = function (sets) {
  _setsCache.length = 0;
  for (const s of sets) _setsCache.push(s);
  if (!document.getElementById('viewSets').classList.contains('hidden')) {
    renderSetsPage();
  }
};

/* ---------- Shared-with-me sets cache ---------- */
window.bpReplaceSharedSetsCache = function (sets) {
  _sharedSetsCache.length = 0;
  for (const s of sets) _sharedSetsCache.push(s);
  if (!document.getElementById('viewSets').classList.contains('hidden')) {
    renderSetsPage();
  }
};

/* Ids of sets that are shared (either I shared them out, or shared with me).
   Used to decide whether a problem's Discussion button is shown. */
const _sharedSetIds = new Set();
window.bpReplaceSharedSetIds = function (ids) {
  _sharedSetIds.clear();
  for (const id of ids) _sharedSetIds.add(id);
  // If a problem is on screen, re-render so the Discussion button appears/hides.
  if (!document.getElementById('viewBridge').classList.contains('hidden') && problemSet.length) {
    show(cursor);
  }
};

const notesFrameWrap = document.getElementById('notesFrameWrap');

// Drag initiated from inside the iframe via postMessage
let _dragOverlay = null;
window.addEventListener('message', (e) => {
  if (e.data?.type === 'discussion-close') { closeNotesPanel(); return; }
  if (e.data?.type === 'discussion-drag-start') {
    const rect = notesFrameWrap.getBoundingClientRect();
    const ox = e.data.clientX - (rect.left + window.screenX);
    const oy = e.data.clientY - (rect.top + window.screenY);
    notesFrameWrap.style.left = rect.left + 'px';
    notesFrameWrap.style.top = rect.top + 'px';
    notesFrameWrap.style.right = 'auto';
    _dragOverlay = document.createElement('div');
    _dragOverlay.className = 'notes-drag-overlay';
    notesFrameWrap.appendChild(_dragOverlay);
    const onMove = (ev) => {
      notesFrameWrap.style.left = (ev.screenX - window.screenX - ox) + 'px';
      notesFrameWrap.style.top = (ev.screenY - window.screenY - oy) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (_dragOverlay) { _dragOverlay.remove(); _dragOverlay = null; }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }
});

/* ---------- Per-problem overrides (level, tags) + attempt history ---------- */
const STORAGE_OVERRIDES = 'bridgeProblemOverrides.v1';
const STORAGE_GRADES    = 'bridgeProblemGrades.v1';

function loadOverrides() {
  try { return JSON.parse(localStorage.getItem(STORAGE_OVERRIDES) || '{}'); }
  catch (e) { return {}; }
}
function writeOverrides(map) {
  localStorage.setItem(STORAGE_OVERRIDES, JSON.stringify(map));
}
function getOverride(pid) { return loadOverrides()[pid] || {}; }
function saveOverride(pid, patch) {
  const all = loadOverrides();
  const next = { ...(all[pid] || {}), ...patch };
  if (next.level == null) delete next.level;
  if (!next.tags || next.tags.length === 0) delete next.tags;
  if (Object.keys(next).length === 0) delete all[pid];
  else all[pid] = next;
  writeOverrides(all);
}
/* DB row is now the source of truth; localStorage overrides have been
   migrated. The legacy loadOverrides/getOverride/saveOverride functions
   above are intentionally left in place but no longer called. */
function effectiveLevel(p) {
  return (p.level != null) ? p.level : null;
}

// Attempts live in the DB (bp_problem_attempts), keyed by problem
// so they follow a problem across sets, books and devices. This in-memory map
// (problem_id -> attempt[]) is hydrated from the DB on load and is the source
// of truth for the synchronous render code; each mutation upserts its problem.
let _attemptsCache = {};
function loadGrades() { return _attemptsCache; }
function persistAttempts(pid) {
  const arr = _attemptsCache[pid] || [];
  Promise.resolve(window.bpDb?.saveProblemAttempts?.(pid, arr))
    .catch(e => console.warn('Failed to save attempts:', e));
}
// Append a finished attempt row (interactive commit, or a manual row for a
// non-playable problem). Returns its index.
function pushAttempt(pid, row) {
  const list = _attemptsCache[pid] || (_attemptsCache[pid] = []);
  const ctx = currentSetContext();
  list.push({ setId: ctx.id || null, setName: ctx.name || null, ...row });
  persistAttempts(pid);
  return list.length - 1;
}

// Pull this user's attempts from the DB into the cache, then one-time migrate
// any attempts still sitting in this browser's localStorage. Idempotent: the
// localStorage key is renamed after a successful merge so it runs once/device.
async function hydrateAttempts() {
  let rows = [];
  try { rows = (await window.bpDb?.listMyAttempts?.()) || []; } catch (e) { rows = []; }
  const cache = {};
  for (const r of rows) cache[r.problemId] = Array.isArray(r.attempts) ? r.attempts : [];
  try {
    const raw = localStorage.getItem(STORAGE_GRADES);
    if (raw) {
      const local = JSON.parse(raw) || {};
      for (const pid of Object.keys(local)) {
        const localArr = Array.isArray(local[pid]) ? local[pid] : [];
        if (!localArr.length) continue;
        const dbArr = cache[pid] || [];
        const seen = new Set(dbArr.map(a => a.timestamp));
        const merged = dbArr.concat(localArr.filter(a => !seen.has(a.timestamp)));
        cache[pid] = merged;
        if (merged.length !== dbArr.length) {
          Promise.resolve(window.bpDb?.saveProblemAttempts?.(pid, merged)).catch(() => {});
        }
      }
      const nk = `${STORAGE_GRADES}.migrated-${new Date().toISOString().slice(0, 10)}`;
      localStorage.setItem(nk, raw);
      localStorage.removeItem(STORAGE_GRADES);
    }
  } catch (e) { /* migration best-effort */ }
  _attemptsCache = cache;
}
window.bpHydrateAttempts = hydrateAttempts;

/* ---------- Interactive Library ---------- */
// The library = every book that has at least one problem with is_interactive = true.
// It "belongs to" the admin user; non-admins see an empty library. Book scope
// on open is ALL problems in the book (not just the interactive ones).
function libraryBooks() {
  const counts = {};
  const authors = {};
  const hasInteractive = new Set();
  for (const p of problems) {
    const title = p.book_title;
    if (!title) continue;
    counts[title] = (counts[title] || 0) + 1;
    if (p.author) authors[title] = p.author;
    if (p.is_interactive) hasInteractive.add(title);
  }
  return [...hasInteractive].sort((a, b) => a.localeCompare(b))
    .map(title => ({ title, count: counts[title] || 0, author: authors[title] || '' }));
}

function bookRowsHtml(books, { removable = false } = {}) {
  return `<div class="set-list">${books.map(b => `

      </div>

}

function shuffleInPlace(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function openBook(bookTitle, jumbled) {
  let list = problems.filter(p => p.book_title === bookTitle);
  if (!list.length) { alert('This book has no problems.'); return; }
  list = list.slice();
  if (jumbled) shuffleInPlace(list);
  // Record the open for "Reading Now", then refresh that section.
  Promise.resolve(window.bpDb?.recordBookOpen?.(bookTitle))
    .then(() => renderReadingNow())
    .catch(() => {});
  // Books are read-only, transient sets — pass a null saved-set id and flag
  // the reading mode so the set-building filters card stays hidden.
  readingBook = true;
  readingBookTitle = bookTitle;
  readingBookJumbled = !!jumbled;
  _doOpenSet(null, bookTitle, list, 0, false, null);
}

// Open a book from "Reading Now": skip the in-order/jumbled prompt and resume
// at the saved position, reusing the exact order last read (jumbled or not).
async function openBookResume(bookTitle) {
  // Apply this book's saved carding prefs silently (no dialog on resume).
  const bookPrefs = loadBookCarding(bookTitle);
  if (bookPrefs) saveCardingPrefs(bookPrefs);
  const saved = await loadBookProgress(bookTitle);
  let list = null;
  // Only replay the exact saved sequence when it was a JUMBLED read — an
  // in-order read must follow the current numeric sort (older saved progress,
  // captured before the sort fix, has no `jumbled` flag and is rebuilt here).
  readingBookJumbled = !!(saved && saved.jumbled);
  if (readingBookJumbled && Array.isArray(saved.order) && saved.order.length) {
    const byId = Object.fromEntries(problems.map(p => [p.problem_id, p]));
    list = saved.order.map(id => byId[id]).filter(Boolean);
  }
  const rebuilt = !list || !list.length;
  if (rebuilt) list = problems.filter(p => p.book_title === bookTitle);
  if (!list.length) { alert('This book has no problems.'); return; }
  // Resume position: for a jumbled replay the saved cursor indexes `list`
  // directly; for a rebuilt in-order list, follow the problem you were on
  // (its index may have moved under the corrected sort).
  let startIdx = saved ? Math.min(Math.max(0, saved.cursor | 0), list.length - 1) : 0;
  if (rebuilt && saved && Array.isArray(saved.order) && saved.order[saved.cursor | 0]) {
    const curId = saved.order[saved.cursor | 0];
    const idx = list.findIndex(p => p.problem_id === curId);
    if (idx >= 0) startIdx = idx;
  }
  Promise.resolve(window.bpDb?.recordBookOpen?.(bookTitle))
    .then(() => renderReadingNow())
    .catch(() => {});
  readingBook = true;
  readingBookTitle = bookTitle;
  _doOpenSet(null, bookTitle, list, startIdx, false, null);
}

async function renderReadingNow() {
  const section = document.getElementById('readingNowSection');
  const root = document.getElementById('readingNowRoot');
  if (!section || !root) return;
  const isAdmin = document.body.classList.contains('is-admin');
  const libTitles = new Set(isAdmin ? libraryBooks().map(b => b.title) : []);
  let recents = [];
  try { recents = (await window.bpDb?.listRecentBooks?.(2)) || []; } catch (e) { recents = []; }
  // Only surface books that are still in the library.
  recents = recents.filter(r => libTitles.has(r.bookTitle));
  if (!recents.length) { section.classList.add('hidden'); root.innerHTML = ''; return; }
  const counts = {};
  for (const p of problems) counts[p.book_title] = (counts[p.book_title] || 0) + 1;
  root.innerHTML = bookRowsHtml(recents.map(r => ({ title: r.bookTitle, count: counts[r.bookTitle] || 0 })), { removable: true });
  root.querySelectorAll('[data-act="open-book"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const title = btn.closest('[data-book]').dataset.book;
      openBookResume(title);   // Reading Now resumes where you left off — no order prompt
    });
  });
  root.querySelectorAll('[data-act="remove-book"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const title = btn.closest('[data-book]').dataset.book;
      try { await window.bpDb?.removeRecentBook?.(title); } catch (e) { alert('Remove failed: ' + (e.message || e)); return; }
      clearBookCarding(title);
      renderReadingNow();
    });
  });
  section.classList.remove('hidden');
}
